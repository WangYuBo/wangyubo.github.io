# Site settings
title: 钰博的博客
SEOTitle:  钰博的博客
header-img: img/190211_snow_2.jpeg
email: freerunner#foxmail.com
description: "孰能浊静之以徐清，孰能安动之以徐生"
keyword: "wangyubo Blog, 慕广陵的博客, wangyubo, 钰博， 修身养性， 文化产业, 文产, 古琴"
url: "https://muguangling.com"         # your host, for absolute URL
                                       # ↑ 协议必须跟站点一致：它是 canonical（head.html:22）、
                                       #   feed.xml、sitemap 的绝对前缀。写 http 会让每页都
                                       #   对外声明一个和实际不符的规范地址。
baseurl: ""      # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: "https://github.com/WangYuBo/wangyubo.github.io.git" # you code repository

# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "Goals determine what you going to be!"
sidebar-avatar: /img/mgl.jpg      # use absolute URL, seeing it's used in both `/` and `/about/`


        
# SNS settings
RSS: true
# weibo_username:     wangyubo 
github_username:    wangyubo
douban_ussername:   Free_Runner
facebook_username:  Bergen Wang




# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 20
exclude:
  - "less"
  - "node_modules"
  - "Gruntfile.js"
  - "package.json"
  - "README.md"
  - "vendor"
  - "DESIGN_UPDATE.md"
  - "README_DESIGN.md"
anchorjs: true                          # if you want to customize anchor. check out line:181 of `post.html`



# Gems
# from PR#40, to support local preview for Jekyll 3.0
# jekyll-sitemap 产出 /sitemap.xml，collection 文档（_attention/）也会被收录。
# 两个都在 GitHub Pages 白名单内；上面这行必须留在本文件第一份 YAML 文档里（见文件末尾的 ─── ）。
gems: [jekyll-paginate, jekyll-sitemap]

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM                            # use Github Flavored Markdown !important



# 评论系统
# Disqus（https://disqus.com/）
# disqus_username: 

# utteranc.es 评论插件
