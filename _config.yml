# Gitalk
gitalk:
  enable: false    #是否开启Gitalk评论
  clientID: 895f6f62380e2dc262d8                            #生成的clientID
  clientSecret: a41665f5af72e9a2f28724a88bfceb2597e0949f    #生成的clientSecret
  repo: wangyubo.github.io    #仓库名称
  owner: wangyubo    #github用户名
  admin: wangyubo
  distractionFreeMode: true #是否启用类似FB的阴影遮罩



# Featured Tags
featured-tags: true                     # 是否使用首页标签
featured-condition-size: 1              # 相同标签数量大于这个数，才会出现在首页



# Progressive Web Apps
chrome-tab-theme-color: "#000000"
service-worker: true


# 《夺回注意力》网页试读版。
# 章节 md 由书仓库的 scripts/publish_web.py 生成（见 books/attention-book/web.yaml），
# 站点端不要手改 _attention/ 下的文件。
# URL 走 collection 默认模板 /:collection/:path/ 加上 pretty 的尾斜杠，
# 即 _attention/02-selection.md → /attention/02-selection/、
#    _attention/en/02-selection.md → /attention/en/02-selection/。
collections:
  attention:
    output: true


# ⚠️ 警告：下面这行 `---` 起是本文档的**第二份 YAML document**。
# Jekyll 只解析第一份，所以 `---` 往下的配置（theme、friends…）从未生效过。
# 新增配置一律写在这一行以上。
---
layout:     keynote
iframe:     "http://muguangling.com/2021/03/11/2021-03-05-long-distance-relationship/"
